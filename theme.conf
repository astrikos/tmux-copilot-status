# Rounded caps require a Nerd Font or another font with Powerline round glyphs.
set -g status 2
set -g status-interval 2
set -g status-style 'bg=#1b1b20,fg=#c5c8d3,nodim'

# User ranges carry an explicit pane ID, including panes in another session.
bind-key -n MouseDown1Status if-shell -F '#{mouse_status_range}' 'run-shell -C "switch-client -Z -c #{q:client_name} -t #{q:mouse_status_range}"'
